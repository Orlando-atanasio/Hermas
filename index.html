    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const raw = localStorage.getItem('hermas_settings_v1');
          const settings = raw ? JSON.parse(raw) : null;
          const theme = settings ? settings.theme : 'escuro';
          if (theme === 'escuro' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}

        // Suppress expected HMR WebSocket errors in iframe environment when HMR is disabled
        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.includes('send was called before connect') || e.message.includes('WebSocket'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && typeof e.reason.message === 'string' && (e.reason.message.includes('send was called before connect') || e.reason.message.includes('WebSocket'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#0f172a] text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
